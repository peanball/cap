version: "2"
run:
  timeout: 2m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      # Fixture generator writes to testdata with world-readable perms; not
      # a shipped artifact.
      - test/main.go
    rules:
      # binary.Write into a bytes.Buffer cannot fail; fitting every constructor
      # call with `_ =` adds nothing but noise.
      - linters: [errcheck]
        text: "binary\\.Write"
      # Constructors for internal matcher types: godoc cost outweighs what
      # the linter can read off the name.
      - linters: [revive]
        text: "exported (function|method|const|var) .* should have comment"
        path: internal/(match|pcap|proxyhdr|testgenpcap)/
      # Interface-satisfying methods where some parameters are structurally
      # unused (reassembly.Stream.Accept, ReassembledSG).
      - linters: [revive]
        text: "unused-parameter"
        path: internal/engine/stream\.go

formatters:
  enable:
    - gofmt
