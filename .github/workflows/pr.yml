name: pr

on:
  pull_request: # safe for fork PRs: no secrets, read-only GITHUB_TOKEN

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable' # latest Go release

      - run: go build ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:" >&2
            echo "$out" >&2
            exit 1
          fi

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: latest

      - run: go test -race ./...

      - name: fixture drift
        # go run ./test is deterministic; a diff means the generator or a
        # fixture went out of sync with the manifest. See internal/testgenpcap.
        run: |
          go run ./test
          git diff --exit-code -- '*testdata*'
