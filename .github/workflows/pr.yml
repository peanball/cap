name: pr

on:
  pull_request: # safe for fork PRs: no secrets, read-only GITHUB_TOKEN

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable' # latest Go release

      - run: go build ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:" >&2
            echo "$out" >&2
            exit 1
          fi

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

      - run: go test -race ./...

      - name: fixture drift
        # go run ./test is deterministic; a diff means the generator or a
        # fixture went out of sync with the manifest. See internal/testgenpcap.
        run: |
          go run ./test
          git diff --exit-code -- '*testdata*'
