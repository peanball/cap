# Auto-merge Dependabot PRs (rebase strategy) so contributor attention is only
# spent on test failures, then tag + release when a direct dependency moved.
# Keyed on Dependabot's `dependency-type: direct` label; indirect bumps merge
# without tagging.
name: dependabot

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      is-direct: ${{ steps.meta.outputs.dependency-type == 'direct' && steps.meta.outputs.package-ecosystem == 'gomod' }}
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --rebase "$PR_URL"
          echo "merged=true" >> "$GITHUB_OUTPUT"

  tag-and-release:
    needs: merge
    if: needs.merge.outputs.is-direct == 'true' && needs.merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: next minor tag
        id: tag
        run: |
          latest="$(git tag --sort=-version:refname | head -1)"
          latest="${latest#v}"
          major="${latest%%.*}"
          rest="${latest#*.}"
          minor="${rest%%.*}"
          next="v${major}.$(( minor + 1 )).0"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: tag + push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "dependabot[bot]@users.noreply.github.com"
          git config user.name "dependabot[bot]"
          git tag "${{ steps.tag.outputs.next }}"
          git push origin "${{ steps.tag.outputs.next }}"
