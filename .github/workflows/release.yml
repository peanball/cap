name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write     # create release, upload assets
  id-token: write     # artifact attestation of build provenance
  attestations: write # persist attest-build-provenance output

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          bin=cap
          [ "$GOOS" = "windows" ] && bin=cap.exe
          go build -trimpath -ldflags="-s -w" -o "$bin" ./cmd/cap

          name="cap_${GOOS}_${GOARCH}.tar.gz"
          tar -czf "$name" "$bin" README.md AGENTS.md
          sha256sum "$name" > "$name.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true

      - name: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'cap_*.tar.gz'

      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See commit log for details" \
            --verify-tag \
            cap_*.tar.gz cap_*.tar.gz.sha256
