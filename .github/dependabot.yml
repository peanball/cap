# .github/dependabot.yml — auto-bump gopacket and go-flags, GitHub Actions,
# and the toolchain (go directive). gomod and GitHub Actions bumps each land
# as one grouped PR per run: chained dependencies matter together, and per-
# dependency PRs rebase constantly. Auto-merged via .github/workflows/dependabot.yml.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
